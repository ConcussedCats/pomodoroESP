; Telos Pomodoro Flip Cube firmware.
; Hardware: ESP32 DevKit V1 38-pin (ESP32-WROOM), see include/pins.h.
;
; Hardware bring-up goes part by part, from the simplest to the hardest.
; Every part has its own small test firmware (env hw_<part>), e.g.:
;   pio run -e hw_rgb -t upload -t monitor

[platformio]
default_envs = hw_buzzer

[env]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION=\"0.1.0\"

; ---------------------------------------------------------------------------
; Part tests. Each one compiles only its test file and the modules it needs.
; ---------------------------------------------------------------------------

; 1. RGB LED (GPIO25/32/33): colour order, brightness, effects.
[env:hw_rgb]
build_src_filter =
    +<hwtest/test_rgb.cpp>
    +<ui/rgb_led.cpp>

; 2. Buttons S1 (GPIO19) / S2 (GPIO17): debounce, short / 3 s / 10 s. LED shows the state.
[env:hw_buttons]
build_src_filter =
    +<hwtest/test_buttons.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; 3. Piezo buzzer (GPIO13 -> NPN Q3 -> J1): beep, frequency sweep, melodies.
[env:hw_buzzer]
build_src_filter =
    +<hwtest/test_buzzer.cpp>
    +<ui/buzzer.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>
