; Telos Pomodoro Flip Cube firmware.
; Hardware: ESP32 DevKit V1 38-pin (ESP32-WROOM), see include/pins.h.
;
; Hardware bring-up goes part by part, from the simplest to the hardest.
; Every part has its own small test firmware (env hw_<part>), e.g.:
;   pio run -e hw_rgb -t upload -t monitor

[platformio]
default_envs = hw_display

[env]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION=\"0.1.0\"

; ---------------------------------------------------------------------------
; Part tests. Each one compiles only its test file and the modules it needs.
; ---------------------------------------------------------------------------

; 1. RGB LED (GPIO25/32/33): colour order, brightness, effects.
[env:hw_rgb]
build_src_filter =
    +<hwtest/test_rgb.cpp>
    +<ui/rgb_led.cpp>

; 2. Buttons S1 (GPIO19) / S2 (GPIO17): debounce, short / 3 s / 10 s. LED shows the state.
[env:hw_buttons]
build_src_filter =
    +<hwtest/test_buttons.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; 3. Piezo buzzer (GPIO13 -> NPN Q3 -> J1): beep, frequency sweep, melodies.
[env:hw_buzzer]
build_src_filter =
    +<hwtest/test_buzzer.cpp>
    +<ui/buzzer.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; 4. Vibration motor (GPIO16 -> HW-517 -> M1, powered from LM2596): patterns, strength.
[env:hw_vibration]
build_src_filter =
    +<hwtest/test_vibration.cpp>
    +<ui/vibration.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; ST7789 240x240 via TFT_eSPI, configured here instead of editing User_Setup.h.
[tft]
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    ; No MISO on the display. With -1 the ESP32 core falls back to VSPI MISO = GPIO19 and
    ; turns it into a plain input, which breaks button S1. GPIO35 is unused and input-only.
    -DTFT_MISO=35
    -DTFT_CS=-1
    -DTFT_DC=27
    -DTFT_RST=26
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1

; 5. Display ST7789 1.3" 240x240 (SPI mode 3, no CS): colours, orientation, text, speed.
[env:hw_display]
lib_deps = ${tft.lib_deps}
build_flags =
    ${env.build_flags}
    ${tft.build_flags}
build_src_filter =
    +<hwtest/test_display.cpp>
    +<ui/display.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>
