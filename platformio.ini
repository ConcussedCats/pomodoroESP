; Telos Pomodoro Flip Cube firmware.
; Hardware: ESP32 DevKit V1 38-pin (ESP32-WROOM), see include/pins.h.
;
;   pio run -e cube_fast -t upload -t monitor   cube firmware, 20 s / 10 s / 15 s phases
;   pio run -e cube -t upload                   cube firmware, 25 / 5 / 15 min
;   pio test -e native                          timer logic tests on the PC (needs gcc)
;   pio run -e hw_<part> -t upload -t monitor   hardware test of one part

[platformio]
default_envs = cube_fast

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFIRMWARE_VERSION=\"0.1.0\"

[esp32]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3

; ST7789 240x240 via TFT_eSPI, configured here instead of editing User_Setup.h.
[tft]
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    ; No MISO on the display. With -1 the ESP32 core falls back to VSPI MISO = GPIO19 and
    ; turns it into a plain input, which breaks button S1. GPIO35 is unused and input-only.
    -DTFT_MISO=35
    -DTFT_CS=-1
    -DTFT_DC=27
    -DTFT_RST=26
    -DTFT_SPI_MODE=SPI_MODE3
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1

; ---------------------------------------------------------------------------
; Cube firmware
; ---------------------------------------------------------------------------

[cube]
extends = esp32
; 1.9 MB per app slot (BLE + Wi-Fi + TLS do not fit the default 1.25 MB); NVS stays at 0x9000.
board_build.partitions = min_spiffs.csv
lib_deps =
    ${tft.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1
build_flags =
    ${esp32.build_flags}
    ${tft.build_flags}
build_src_filter =
    +<*>
    -<hwtest/>

[env:cube]
extends = cube

; Same firmware with short phases for testing on the desk.
[env:cube_fast]
extends = cube
build_flags =
    ${cube.build_flags}
    -DTELOS_DEBUG=1
    -DTELOS_DEFAULT_WORK_S=20
    -DTELOS_DEFAULT_SHORT_S=10
    -DTELOS_DEFAULT_LONG_S=15

; ---------------------------------------------------------------------------
; Host unit tests (CI runs them; locally they need gcc in PATH)
; ---------------------------------------------------------------------------

[env:native]
platform = native
test_build_src = yes
build_src_filter =
    +<timer/timer_core.cpp>
    +<timer/snapshot.cpp>

; ---------------------------------------------------------------------------
; Part tests. Each one compiles only its test file and the modules it needs.
; ---------------------------------------------------------------------------

; 1. RGB LED (GPIO25/32/33): colour order, brightness, effects.
[env:hw_rgb]
extends = esp32
build_src_filter =
    +<hwtest/test_rgb.cpp>
    +<ui/rgb_led.cpp>

; 2. Buttons S1 (GPIO19, blue) / S2 (GPIO17, red): debounce, short / 3 s / 10 s.
[env:hw_buttons]
extends = esp32
build_src_filter =
    +<hwtest/test_buttons.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; 3. Piezo buzzer (GPIO13 -> NPN Q3 -> J1): beep, frequency sweep, melodies.
[env:hw_buzzer]
extends = esp32
build_src_filter =
    +<hwtest/test_buzzer.cpp>
    +<ui/buzzer.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; 4. Vibration motor (GPIO16 -> HW-517 -> M1, powered from LM2596): patterns, strength.
[env:hw_vibration]
extends = esp32
build_src_filter =
    +<hwtest/test_vibration.cpp>
    +<ui/vibration.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>

; 5. Display ST7789 1.3" 240x240 (SPI mode 3, no CS): colours, orientation, text, speed.
[env:hw_display]
extends = esp32
lib_deps = ${tft.lib_deps}
build_flags =
    ${esp32.build_flags}
    ${tft.build_flags}
build_src_filter =
    +<hwtest/test_display.cpp>
    +<ui/display.cpp>
    +<buttons/buttons.cpp>

; 6. MPU6050 (I2C SDA 21 / SCL 22): axis up, face, 600 ms debounce, shown on the display.
[env:hw_mpu]
extends = esp32
lib_deps = ${tft.lib_deps}
build_flags =
    ${esp32.build_flags}
    ${tft.build_flags}
build_src_filter =
    +<hwtest/test_mpu.cpp>
    +<faces/faces.cpp>
    +<faces/mpu6050.cpp>
    +<ui/display.cpp>
    +<buttons/buttons.cpp>
    +<ui/rgb_led.cpp>
    +<ui/vibration.cpp>
