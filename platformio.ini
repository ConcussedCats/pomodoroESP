; Telos Pomodoro Flip Cube firmware.
; Hardware: ESP32 DevKit V1 38-pin (ESP32-WROOM), see include/pins.h.

[platformio]
default_envs = hwtest

[env]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION=\"0.1.0\"
    ; --- TFT_eSPI setup (no User_Setup.h edits needed) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=27
    -DTFT_RST=26
    -DTFT_SPI_MODE=SPI_MODE3
    -DTFT_RGB_ORDER=TFT_RGB
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
lib_deps =
    bodmer/TFT_eSPI@2.5.43

; Stage 1: hardware check (display, RGB, vibration, buzzer, buttons, MPU6050 face).
[env:hwtest]
build_flags =
    ${env.build_flags}
    -DTELOS_HW_TEST=1
